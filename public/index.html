      { key: 'debtToEquity', label: 'Debt to equity below 0.80', ch: '42', test: function (r) { return isNum(r.debtToEquity) && r.debtToEquity >= 0 && r.debtToEquity < 0.8; } },

    function loadScreenIndex() {

    function prepareScreenRows(rows) {

      rows.forEach(function (r) {

    function loadScreenRows(venue) {

    function screenList(data) {
      var q = screenState.query, ticked = SCREEN_RULES.map(function (rule, i) { return screenState.rules[rule.key] ? i : -1; }).filter(function (i) { return i >= 0; });
      var list = data.rows.filter(function (r) {
        if (q && r.search.indexOf(q) < 0) return false;
        for (var k = 0; k < ticked.length; k++) if (!r.rulesMet[ticked[k]]) return false;
        return true;
      });
      var col = screenColumn(screenState.sort), dir = screenState.dir === 'asc' ? 1 : -1;
      list.sort(function (a, b) {
        var x = screenSortValue(a, col), y = screenSortValue(b, col);
        var xn = x === null, yn = y === null;
        if (xn && yn) return (a.name || '').localeCompare(b.name || '');
        if (xn) return 1;
        if (yn) return -1;
        if (typeof x === 'string') return dir * x.localeCompare(y) || (a.name || '').localeCompare(b.name || '');
        return dir * (x - y) || (a.name || '').localeCompare(b.name || '');
      });
      return { list: list, ticked: ticked.length };

    var NAME_COLUMN = { key: 'name', label: 'Company', text: true };
    function screenColumn(key) {
      if (key === 'name') return NAME_COLUMN;
      for (var i = 0; i < SCREEN_COLUMNS.length; i++) if (SCREEN_COLUMNS[i].key === key) return SCREEN_COLUMNS[i];
      return SCREEN_COLUMNS[1];
    }

    function screenSortValue(r, col) {
      if (col.key === 'name') return r.name || r.symbol;
      if (col.text) { var t = col.show ? col.show(r) : r[col.key]; return t ? String(col.key === 'nextReport' || col.key === 'year' ? r[col.key] : t) : null; }
      var v = r[col.key];
      return isNum(v) ? v : null;
    }

    function screenCellHtml(r, col) {
      if (col.text) { var t = col.show ? col.show(r) : (r[col.key] || ''); return '<td class="t' + (t ? '' : ' none') + '">' + (t ? esc(t) : '\u2014') + '</td>'; }
      if (col.unit === 'rules') return '<td class="v">' + r.rules + '/' + SCREEN_RULES.length + '</td>';
      var v = r[col.key];
      if (!isNum(v)) return '<td class="v none">\u2014</td>';

    function drawScreenTable(venue, data) {

        return;

      var wanted = fromHash ? String(fromHash).toUpperCase() : '';
      var venue = venues.indexOf(wanted) >= 0 ? wanted : (venues.indexOf(screenState.venue) >= 0 ? screenState.venue : venues[0]);
      if (screenState.venue !== venue) { screenState.venue = venue; screenState.shown = SCREEN_PAGE; }

    function slugOf(name) {
      return String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function cleanItems(arr) {
      var out = [], seen = {};
      if (!Array.isArray(arr)) return out;
      arr.forEach(function (it) {
        if (!it || typeof it !== 'object') return;
        var symbol = normaliseSymbol(it.symbol);
        if (!symbol || seen[symbol]) return;
        seen[symbol] = true;
        var name = typeof it.name === 'string' ? it.name.trim() : '';
        out.push({ name: name || symbol, symbol: symbol });
      });
      return out;
    }

    function cleanLists(arr) {
      var out = [], seen = {};
      if (!Array.isArray(arr)) return out;
      arr.forEach(function (l) {
        if (!l || typeof l !== 'object') return;
        var name = typeof l.name === 'string' ? l.name.trim() : '';
        var id = typeof l.id === 'string' && /^[a-z0-9-]+$/.test(l.id) ? l.id : slugOf(name);
        if (!name || !id || seen[id]) return;
        seen[id] = true;
        out.push({ id: id, name: name, items: cleanItems(l.items), updated: typeof l.updated === 'string' ? l.updated : '' });
      });
      return out;
    }

          return { last: typeof d.last === 'string' ? d.last : '', lists: cleanLists(d.lists) };
        }
      } catch (e) {}
      return { last: '', lists: startingLists() };
    }

        for (var i = order.indexOf(l.id) + 1; i < order.length && at === watchlists.lists.length; i++) {
          for (var j = 0; j < watchlists.lists.length; j++) if (watchlists.lists[j].id === order[i]) { at = j; break; }

      }
      var rename = kind === 'rename';
      return '<form class="add-form one" id="name-form" autocomplete="off">' +
        '<div class="f"><label for="list-name">' + (rename ? 'New name for this list' : 'Name of the new list') + '</label>' +
        '<input type="text" id="list-name" value="' + (rename ? esc(list.name) : '') + '" placeholder="Banks"></div>' +
        '<button type="submit" id="name-go">' + (rename ? 'Save' : 'Create') + '</button><button type="button" class="secondary" id="name-cancel">Cancel</button></form>';
    }

    function listActionsHtml(list) {
      return (list ? '<button type="button" class="linkbtn" id="list-rename">Rename</button>' : '') +
        '<button type="button" class="linkbtn" id="list-new">New list</button>' +
        (list ? '<button type="button" class="linkbtn" id="list-delete">Delete this list</button>' : '') +
        (missingStartingLists().length ? '<button type="button" class="linkbtn" id="list-restore">Restore the starting lists</button>' : '');
    }

    function listHtml(list) {
      var kept = 0, storedCount = 0, sampledCount = 0;
      var rows = list.items.map(function (it, i) {
        var has = !!numbers.companies[it.symbol];
        if (has) kept++;
        var stored = !has && inStore(it.symbol);
        if (stored) storedCount++;
        var sampled = !has && !stored && !!samples.byId[it.symbol];
        if (sampled) sampledCount++;
        return '<li><span class="num">' + (i + 1) + '</span><span class="who"><a href="#companies/' + esc(it.symbol) + '" title="Open the numbers for ' + esc(it.name) + '">' + esc(it.name) + '</a>' +
          '<span class="sym">' + esc(it.symbol) + '</span>' + (has ? ' <span class="mark">numbers kept</span>' : stored ? ' <span class="mark store-tag">in the store</span>' : (sampled ? ' <span class="mark type-tag">sample data</span>' : '')) + '</span>' +
          '<button type="button" class="linkbtn remove" data-symbol="' + esc(it.symbol) + '" aria-label="Remove ' + esc(it.name) + ' from this list">Remove</button></li>';
      }).join('');
      return '<p class="kicker">Watchlist</p>' +
        '<h2 class="headline">' + esc(list.name) + '</h2>' +
        '<p class="company-meta"><span>' + countText(list.items.length) + (kept ? ', ' + kept + ' with numbers kept on this device' : '') + (storedCount ? ', ' + storedCount + ' in the store' : '') + (sampledCount ? ', ' + sampledCount + ' with sample data' : '') + '</span>' + listActionsHtml(list) + '</p>' +
        '<div id="name-slot"></div>' +
        (rows ? '<ol class="wlist">' + rows + '</ol>' : '<p class="hint">Nothing in this list yet.</p>');
    }

    function noListHtml() {
      return '<p class="kicker">Watchlists</p>' +
        (watchlists.lists.length
          ? '<h2 class="headline">No list at this address</h2><p class="hint">Pick a watchlist above, or make a new one.</p>'
          : '<h2 class="headline">No watchlists yet</h2><p class="hint">Make a new list, or bring the starting lists back.</p>') +
        '<p class="company-meta">' + listActionsHtml(null) + '</p><div id="name-slot"></div>';
    }

    function renderWatchlists(fromHash) {
      showView('watchlists');
      var list = fromHash ? listById(fromHash) : (listById(watchlists.last) || watchlists.lists[0] || null);
      renderListTabs(list ? list.id : '');
      if (list && watchlists.last !== list.id) { watchlists.last = list.id; saveWatchlists(); }
      app.innerHTML = '<section class="watchlist">' + (list ? listHtml(list) : noListHtml()) +
        '<p class="status" id="list-status" role="status" aria-live="polite"></p>' +
        '<p class="hint">Click a company to open its numbers. Lists are kept on this device and travel in exports.</p></section>';

      var statusLine = document.getElementById('list-status');
      var slot = document.getElementById('name-slot');
      renderedList = list;
      function say(msg) { statusLine.textContent = msg; }
      if (pendingListStatus) { say(pendingListStatus); pendingListStatus = ''; }
      function keptNote(ok) { return ok ? '' : ' It could not be kept: this browser is blocking storage.'; }
      function goTo(id, msg) {
        pendingListStatus = msg;
        var h = 'watchlists' + (id ? '/' + id : '');
        if (window.location.hash === '#' + h) route(); else window.location.hash = h;
      }
      function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

      function openForm(kind) {
        slot.innerHTML = nameFormHtml(kind, list);
        var form = document.getElementById('name-form');
        var input = document.getElementById('list-name');
        document.getElementById('name-cancel').addEventListener('click', function () { slot.innerHTML = ''; });
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          if (kind === 'delete') {
            watchlists.lists = watchlists.lists.filter(function (l) { return l !== list; });
            if (watchlists.last === list.id) watchlists.last = '';
            goTo('', 'Deleted ' + list.name + '.' + keptNote(saveWatchlists()));
            return;
          }
          var name = input.value.trim();
          if (!name) { input.focus(); return; }
          if (kind === 'rename') {
            list.name = name;
            touchList(list);
            goTo(list.id, 'Renamed the list to ' + name + '.' + keptNote(saveWatchlists()));
            return;
          }
          var fresh = { id: uniqueListId(name), name: name, items: [], updated: new Date().toISOString() };
          watchlists.lists.push(fresh);
          goTo(fresh.id, 'Made the list ' + name + '.' + keptNote(saveWatchlists()));
        });
        if (input) { input.focus(); input.select(); }
      }

      on('list-rename', function () { openForm('rename'); });
      on('list-new', function () { openForm('new'); });
      on('list-delete', function () { openForm('delete'); });
      on('list-restore', function () {
        var back = restoreStartingLists();
        goTo(list ? list.id : back[0].id, 'Brought back ' + back.length + (back.length === 1 ? ' starting list.' : ' starting lists.') + keptNote(saveWatchlists()));
      });

      Array.prototype.forEach.call(app.querySelectorAll('button.remove'), function (btn) {
        btn.addEventListener('click', function () {
          var symbol = btn.getAttribute('data-symbol'), gone = null;
          list.items = list.items.filter(function (it) { if (it.symbol === symbol) { gone = it; return false; } return true; });
          if (!gone) return;
          touchList(list);
          goTo(list.id, 'Removed ' + gone.name + ' from ' + list.name + '.' + keptNote(saveWatchlists()));
        });
      });
    }

    // ---- the next report date ---------------------------------------------
    function fmtDay(ymd) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || ''));
      if (!m) return String(ymd || '');
      return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function nextReportHtml(c) {
      if (c.next === undefined) return '<p class="next-report"><b>Next report</b>Fetch again to see the next report date.</p>';
      if (!c.next) return '<p class="next-report"><b>Next report</b>EODHD lists no report still to come.</p>';
      var when = c.next.when === 'BeforeMarket' ? 'before the market opens' : c.next.when === 'AfterMarket' ? 'after the market closes' : '';
      var text = fmtDay(c.next.date) + (when ? ', ' + when : '') + (c.next.quarter ? ', for the quarter to ' + fmtDay(c.next.quarter) : '') +
        (c.next.estimate !== null && c.next.estimate !== undefined ? '; analysts expect ' + c.next.estimate.toFixed(2) + ' a share' : '');
      if (c.next.date < dateStamp()) return '<p class="next-report"><b>Next report</b>The date EODHD listed, ' + esc(text) + ', has passed. Fetch again for the next one.</p>';
      return '<p class="next-report"><b>Next report</b>' + esc(text) + '.</p>';
    }

    // ---- graphs: any line of the table, by year or by quarter, in a popup ----
    var GRAPH_ICON = '<svg viewBox="0 0 14 12" width="14" height="12" aria-hidden="true" focusable="false"><path d="M1 10.5 4.5 6l3 2L13 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var graph = null;
    var graphDialog = null;

    function graphOption(group, value, text) {
      return '<label class="type"><input type="radio" name="g' + group + '" value="' + value + '"><b>' + text + '</b></label>';
    }

    function ensureGraphDialog() {
      if (graphDialog) return graphDialog;
      var d = document.createElement('dialog');
      d.className = 'graph-dialog';
      d.setAttribute('aria-labelledby', 'graph-title');
      d.innerHTML = '<div class="graph-inner">' +
        '<div class="graph-head"><div><p class="kicker" id="graph-kicker"></p><h3 id="graph-title"></h3><p class="rule" id="graph-rule"></p></div>' +
        '<button type="button" class="secondary" id="graph-close">Close</button></div>' +
        '<form class="graph-controls" id="graph-controls">' +
        '<div class="pick"><label for="graph-from">From</label><select id="graph-from"></select></div>' +
        '<div class="pick"><label for="graph-to">To</label><select id="graph-to"></select></div>' +
        '<fieldset><legend>Window</legend><div class="types">' + graphOption('window', 'shown', 'Shown period') + graphOption('window', '5', 'Last 5 years') + graphOption('window', '10', 'Last 10 years') + '</div></fieldset>' +
        '<fieldset><legend>Period</legend><div class="types">' + graphOption('period', 'annual', 'Annual') + graphOption('period', 'quarterly', 'Quarterly') + '</div></fieldset>' +
        '<fieldset><legend>Chart</legend><div class="types">' + graphOption('kind', 'line', 'Line') + graphOption('kind', 'bar', 'Bar') + '</div></fieldset>' +
        '<fieldset><legend>Trend</legend><div class="types">' + graphOption('trend', 'none', 'None') + graphOption('trend', 'line', 'Straight line') + graphOption('trend', 'band', 'Mean band') + '</div></fieldset>' +
        '</form>' +
        '<div class="graph-body" id="graph-body"></div>' +
        '<div class="graph-figures" id="graph-figures"></div>' +
        '<p class="units" id="graph-units"></p></div>';
      document.body.appendChild(d);
      d.querySelector('#graph-close').addEventListener('click', function () { d.close(); });
      d.addEventListener('click', function (ev) { if (ev.target === d) d.close(); });
      var controls = d.querySelector('#graph-controls');
      controls.addEventListener('submit', function (ev) { ev.preventDefault(); });
      controls.addEventListener('change', function (ev) {
        var t = ev.target;
        if (!graph) return;
        if (t.name === 'gkind') graph.kind = t.value;
        else if (t.name === 'gtrend') graph.trend = t.value;
        else if (t.name === 'gwindow') { graph.window = t.value; applyGraphWindow(); }
        else if (t.name === 'gperiod') { graph.period = t.value; fillGraphRange(); applyGraphWindow(); }
        else if (t.id === 'graph-from') { graph.from = t.value; if (graph.from > graph.to) graph.to = graph.from; graph.window = 'shown'; }
        else if (t.id === 'graph-to') { graph.to = t.value; if (graph.to < graph.from) graph.from = graph.to; graph.window = 'shown'; }
        d.querySelector('input[name="gwindow"][value="' + graph.window + '"]').checked = true;
        d.querySelector('#graph-from').value = graph.from;
        d.querySelector('#graph-to').value = graph.to;
        syncGraphOptions();
        drawGraph();
      });
      window.addEventListener('resize', function () { if (d.open) drawGraph(); });
      graphDialog = d;
      return d;
    }

    function quarterShort(q) {
      return quarterLabel(q).replace(/ \d\d(\d\d)$/, ' $1');
    }

    function graphPeriods(c, period) {
      if (period === 'quarterly') return quarterDates(c).map(function (q) { return { date: q, label: quarterLabel(q), short: quarterShort(q) }; });
      var dates = yearList(c), labels = yearLabels(dates);
      return dates.map(function (d, i) { return { date: d, label: labels[i], short: labels[i] }; });
    }

    function graphValues(c, row, period, periods) {
      var dates = yearList(c);
      return periods.map(function (p) {
        var y = period === 'quarterly' ? quarterData(c, p.date, !!row.annual) : yearData(c, dates, dates.indexOf(p.date));
        var v = y ? row.value(y) : null;
        return (v === null || v === undefined || !isFinite(v)) ? null : v;
      });
    }

    function fillGraphRange() {
      var periods = graphPeriods(graph.c, graph.period);
      var options = periods.map(function (p) { return '<option value="' + esc(p.date) + '">' + esc(p.label) + '</option>'; }).join('');
      var from = graphDialog.querySelector('#graph-from'), to = graphDialog.querySelector('#graph-to');
      from.innerHTML = options;
      to.innerHTML = options;
      graph.from = periods.length ? periods[0].date : '';
      graph.to = periods.length ? periods[periods.length - 1].date : '';
      from.value = graph.from;
      to.value = graph.to;
    }

    // the last 5 or 10 years of the periods on offer, as the shown range
    function applyGraphWindow() {
      var periods = graphPeriods(graph.c, graph.period);
      // "Shown period" is the table's whole run of years; a hand-set range narrows it from there
      var slice = graph.window === 'shown' ? periods : periods.slice(-(parseInt(graph.window, 10) * (graph.period === 'quarterly' ? 4 : 1)));
      if (!slice.length) return;
      graph.from = slice[0].date;
      graph.to = slice[slice.length - 1].date;
    }

    function syncGraphOptions() {
      Array.prototype.forEach.call(graphDialog.querySelectorAll('.graph-controls input[type="radio"]'), function (input) {
        input.parentNode.classList.toggle('on', input.checked);
        input.parentNode.classList.toggle('off', input.disabled);
      });
    }

    function openGraph(c, row) {
      var d = ensureGraphDialog();
      graph = { c: c, row: row, kind: 'line', period: 'annual', from: '', to: '', window: '5', trend: 'none' };
      d.querySelector('#graph-kicker').textContent = c.meta.name + ' · ch. ' + row.ch;
      d.querySelector('#graph-title').textContent = row.label;
      d.querySelector('#graph-rule').textContent = row.rule || '';
      var hasQ = quarterDates(c).length > 0;
      var quarterly = d.querySelector('input[name="gperiod"][value="quarterly"]');
      quarterly.disabled = !hasQ;
      quarterly.parentNode.title = hasQ ? '' : 'No quarters are kept for this company: Fetch again pulls them.';
      d.querySelector('input[name="gperiod"][value="annual"]').checked = true;
      d.querySelector('input[name="gkind"][value="line"]').checked = true;
      d.querySelector('input[name="gwindow"][value="5"]').checked = true;
      d.querySelector('input[name="gtrend"][value="none"]').checked = true;
      fillGraphRange();
      applyGraphWindow();
      d.querySelector('#graph-from').value = graph.from;
      d.querySelector('#graph-to').value = graph.to;
      syncGraphOptions();
      if (!d.open) d.showModal();
      drawGraph();
    }

    function niceTicks(lo, hi, count) {
      var span = (hi - lo) || Math.abs(hi) || 1;
      var raw = span / (count - 1);
      var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      var norm = raw / mag;
      var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
      var start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step, ticks = [];
      for (var k = 0; start + k * step <= end + step / 2; k++) ticks.push(parseFloat((start + k * step).toPrecision(12)));
      return { ticks: ticks, step: step };
    }

    function tickText(v, step, unit) {
      if (unit === 'money' || unit === 'shares') {
        var m = v / 1e6, sm = step / 1e6, dec = sm >= 1 ? 0 : sm >= 0.1 ? 1 : 2;
        return (m < 0 ? '−' : '') + Math.abs(m).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }
      if (unit === 'pct') return (v * 100).toFixed(step * 100 >= 1 ? 0 : 1) + '%';
      return v.toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : 2);
    }

    function barPath(x, y, w, h, neg) {
      var r = Math.min(4, w / 2, h);
      if (h <= 0) return '';
      if (!neg) return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + h) + 'Z';
      return 'M' + x + ' ' + y + 'V' + (y + h - r) + 'Q' + x + ' ' + (y + h) + ' ' + (x + r) + ' ' + (y + h) + 'H' + (x + w - r) + 'Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w) + ' ' + (y + h - r) + 'V' + y + 'Z';
    }

    // the figures behind a run of values: spread, trend and steadiness, over the periods shown
    function graphStats(periods, values, period) {
      var pts = [];
      values.forEach(function (v, i) { if (v !== null) pts.push({ i: i, v: v, label: periods[i].label }); });
      var n = pts.length;
      if (!n) return null;
      var sum = 0;
      pts.forEach(function (p) { sum += p.v; });
      var mean = sum / n;
      var sorted = pts.map(function (p) { return p.v; }).sort(function (a, b) { return a - b; });
      var median = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
      var ss = 0;
      pts.forEach(function (p) { ss += (p.v - mean) * (p.v - mean); });
      var variance = n > 1 ? ss / (n - 1) : 0, sd = Math.sqrt(variance);
      var low = pts[0], high = pts[0];
      pts.forEach(function (p) { if (p.v < low.v) low = p; if (p.v > high.v) high = p; });
      // a straight line fitted to the period index, so a gap keeps its time
      var sx = 0, sxx = 0, sxy = 0;
      pts.forEach(function (p) { sx += p.i; sxx += p.i * p.i; sxy += p.i * p.v; });
      var den = n * sxx - sx * sx;
      var slope = n > 1 && den ? (n * sxy - sx * sum) / den : 0;
      var intercept = mean - slope * (sx / n);
      var sse = 0;
      pts.forEach(function (p) { var e = p.v - (intercept + slope * p.i); sse += e * e; });
      var r2 = n > 1 && ss > 0 ? Math.max(0, 1 - sse / ss) : null;
      var first = pts[0], last = pts[n - 1], steps = last.i - first.i;
      var perYear = period === 'quarterly' ? 4 : 1;
      var change = first.v ? (last.v - first.v) / Math.abs(first.v) : null;
      var growth = (first.v > 0 && last.v > 0 && steps > 0) ? Math.pow(last.v / first.v, perYear / steps) - 1 : null;
      var falls = 0, largest = null;
      for (var k = 1; k < n; k++) {
        var prev = pts[k - 1].v, cur = pts[k].v;
        if (cur < prev) {
          falls++;
          if (prev > 0) { var drop = (prev - cur) / prev; if (!largest || drop > largest.drop) largest = { drop: drop, label: pts[k].label }; }
        }
      }
      return { n: n, mean: mean, median: median, variance: variance, sd: sd, cv: mean ? sd / Math.abs(mean) : null, low: low, high: high,
        slope: slope, intercept: intercept, r2: r2, first: first, last: last, change: change, growth: growth, falls: falls, largest: largest };
    }

    function varianceText(variance, unit) {
      if (unit === 'money' || unit === 'shares') return fmtInt(variance / 1e12) + ' millions²';
      if (unit === 'pct') return (variance * 1e4).toFixed(2) + ' pts²';
      return variance.toFixed(3);
    }

    function figuresHtml(st, periods, unit, period) {
      if (!st) return '<p class="hint">No figures for this range.</p>';
      var what = period === 'quarterly' ? 'quarter' : 'year', shown = periods.length;
      var head = 'Over the ' + shown + ' ' + what + (shown === 1 ? '' : 's') + ' shown, ' + periods[0].label + ' to ' + periods[shown - 1].label +
        (st.n < shown ? ', ' + st.n + ' with a figure' : '');
      function pc(x, signed) { return x === null ? '—' : ((signed && x > 0) ? '+' : '') + (x * 100).toFixed(1) + '%'; }
      var rows = [
        ['Mean', fmtValue(st.mean, unit)],
        ['Median', fmtValue(st.median, unit)],
        ['Standard deviation', fmtValue(st.sd, unit)],
        ['Variance', varianceText(st.variance, unit)],
        ['Coefficient of variation', pc(st.cv)],
        ['Low', fmtValue(st.low.v, unit) + ' (' + st.low.label + ')'],
        ['High', fmtValue(st.high.v, unit) + ' (' + st.high.label + ')'],
        ['Trend, per ' + what, st.n > 1 ? (st.slope > 0 ? '+' : '') + fmtValue(st.slope, unit) : '—'],
        ['Fit to the trend (R²)', st.r2 === null ? '—' : st.r2.toFixed(2)],
        ['Change, first to last', pc(st.change, true)],
        ['Compound growth a year', pc(st.growth, true)],
        ['Falls on the ' + what + ' before', st.n > 1 ? st.falls + ' of ' + (st.n - 1) : '—'],
        ['Largest fall', st.largest ? '−' + (st.largest.drop * 100).toFixed(1) + '% (' + st.largest.label + ')' : 'none']
      ];
      return '<p class="figures-head">' + esc(head) + '</p><dl class="figures">' +
        rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>';
    }

    function chartSvg(periods, values, kind, unit, width, trend, st) {
      var n = periods.length;
      var have = values.filter(function (v) { return v !== null; });
      if (!n || !have.length) return '<p class="hint">No figures to draw for this range.</p>';
      var W = width, H = 320, padL = 72, padR = 20, padT = 22, padB = 44;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var lo, hi;
      if (unit === 'price') {
        // a price chart fits the axis to the prices shown, as a broker's chart does, with a little room above and below
        lo = Math.min.apply(null, have); hi = Math.max.apply(null, have);
        var room = (hi - lo) * 0.06 || Math.abs(hi) * 0.01 || 1;
        lo = Math.max(lo - room, lo >= 0 ? 0 : lo - room); hi += room;
      } else {
        lo = Math.min.apply(null, have.concat([0])); hi = Math.max.apply(null, have.concat([0]));
      }
      var fit = function (i) { return st.intercept + st.slope * i; };
      if (st && trend === 'line' && st.n > 1) { lo = Math.min(lo, fit(st.first.i), fit(st.last.i)); hi = Math.max(hi, fit(st.first.i), fit(st.last.i)); }
      if (st && trend === 'band') { lo = Math.min(lo, st.mean - st.sd); hi = Math.max(hi, st.mean + st.sd); }
      var scale = niceTicks(lo, hi, unit === 'price' ? 6 : 5);
      lo = scale.ticks[0];
      hi = scale.ticks[scale.ticks.length - 1];
      if (hi === lo) hi = lo + 1;
      var band = plotW / n;
      function X(i) { return padL + band * (i + 0.5); }
      function Y(v) { return padT + plotH * (1 - (v - lo) / (hi - lo)); }
      var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" tabindex="0" aria-label="' +
        esc(periods[0].label + ' to ' + periods[n - 1].label + ', ' + have.length + ' figures') + '">';
      scale.ticks.forEach(function (t) {
        var y = Y(t).toFixed(1);
        svg += '<line class="grid' + (t === 0 ? ' zero' : '') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '"/>' +
          '<text class="axis" x="' + (padL - 8) + '" y="' + (+y + 4) + '" text-anchor="end">' + esc(tickText(t, scale.step, unit)) + '</text>';
      });
      var every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / 60))));
      periods.forEach(function (p, i) {
        if ((n - 1 - i) % every === 0) svg += '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (H - padB + 18) + '" text-anchor="middle">' + esc(p.short) + '</text>';
      });
      if (st && trend === 'band') {
        var bx = (X(st.first.i) - band / 2).toFixed(1), bw2 = (X(st.last.i) - X(st.first.i) + band).toFixed(1);
        svg += '<rect class="band" x="' + bx + '" y="' + Y(st.mean + st.sd).toFixed(1) + '" width="' + bw2 + '" height="' + (Y(st.mean - st.sd) - Y(st.mean + st.sd)).toFixed(1) + '"/>' +
          '<line class="mean" x1="' + bx + '" x2="' + (+bx + +bw2).toFixed(1) + '" y1="' + Y(st.mean).toFixed(1) + '" y2="' + Y(st.mean).toFixed(1) + '"/>';
      }
      if (kind === 'bar') {
        var bw = Math.min(24, Math.max(2, band - 2));
        values.forEach(function (v, i) {
          if (v === null) return;
          var y0 = Y(0), y1 = Y(v);
          svg += '<path class="bar' + (v < 0 ? ' neg' : '') + '" data-i="' + i + '" d="' + barPath(X(i) - bw / 2, Math.min(y0, y1), bw, Math.abs(y0 - y1), v < 0) + '"/>';
        });
      } else {
        var d = '', pen = false;
        values.forEach(function (v, i) {
          if (v === null) { pen = false; return; }
          d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
          pen = true;
        });
        svg += '<path class="series" d="' + d + '"/>';
        values.forEach(function (v, i) {
          if (v === null) return;
          svg += '<circle class="pt' + (v < 0 ? ' neg' : '') + '" data-i="' + i + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="4"/>';
        });
      }
      if (st && trend === 'line' && st.n > 1) {
        svg += '<line class="trend" x1="' + X(st.first.i).toFixed(1) + '" y1="' + Y(fit(st.first.i)).toFixed(1) + '" x2="' + X(st.last.i).toFixed(1) + '" y2="' + Y(fit(st.last.i)).toFixed(1) + '"/>';
      }
      var last = -1;
      values.forEach(function (v, i) { if (v !== null) last = i; });
      if (last >= 0 && unit !== 'price') {
        var ly = values[last] < 0 ? Y(values[last]) + 16 : Y(values[last]) - 10;
        svg += '<text class="end" x="' + X(last).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + (last === n - 1 && n > 1 ? 'end' : 'middle') + '">' + esc(fmtValue(values[last], unit)) + '</text>';
      }
      svg += '<line class="cross" id="graph-cross" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + plotH) + '" style="display:none"/>';
      periods.forEach(function (p, i) {
        svg += '<rect class="hit" data-i="' + i + '" x="' + (padL + band * i).toFixed(1) + '" y="' + padT + '" width="' + band.toFixed(1) + '" height="' + plotH + '"/>';
      });
      return svg + '</svg><div class="graph-tip" id="graph-tip" hidden><b></b><span></span></div>';
    }

    function wireGraphHover(body, periods, values, unit, kind) {
      var svg = body.querySelector('svg.chart'), tip = body.querySelector('#graph-tip'), cross = body.querySelector('#graph-cross');
      if (!svg) return;
      var hot = -1;
      function mark(i) { return i < 0 ? null : svg.querySelector('.pt[data-i="' + i + '"], .bar[data-i="' + i + '"]'); }
      function hide() {
        var m = mark(hot);
        if (m) { m.classList.remove('hot'); if (m.tagName === 'circle') m.setAttribute('r', '4'); }
        hot = -1;
        tip.hidden = true;
        cross.style.display = 'none';
      }
      function show(i) {
        if (i < 0 || i >= periods.length) return;
        var m = mark(hot);
        if (m) { m.classList.remove('hot'); if (m.tagName === 'circle') m.setAttribute('r', '4'); }
        hot = i;
        m = mark(i);
        if (m) { m.classList.add('hot'); if (m.tagName === 'circle') m.setAttribute('r', '6'); }
        var hit = svg.querySelector('.hit[data-i="' + i + '"]');
        var x = parseFloat(hit.getAttribute('x')) + parseFloat(hit.getAttribute('width')) / 2;
        cross.setAttribute('x1', x);
        cross.setAttribute('x2', x);
        cross.style.display = kind === 'line' ? '' : 'none';
        tip.firstChild.textContent = values[i] === null ? '—' : fmtValue(values[i], unit);
        tip.lastChild.textContent = periods[i].label;
        tip.hidden = false;
        var rect = svg.getBoundingClientRect(), px = x * rect.width / svg.viewBox.baseVal.width;
        var bodyW = body.clientWidth, tipW = tip.offsetWidth;
        var left = px + 14 + tipW > bodyW ? px - tipW - 14 : px + 14;
        tip.style.left = Math.max(0, Math.min(bodyW - tipW, left)) + 'px';
        tip.style.top = (rect.top - body.getBoundingClientRect().top + 10) + 'px';
      }
      svg.addEventListener('pointermove', function (ev) {
        var h = ev.target.closest ? ev.target.closest('.hit') : null;
        if (h) show(parseInt(h.getAttribute('data-i'), 10));
      });
      svg.addEventListener('pointerleave', hide);
      svg.addEventListener('blur', hide);
      svg.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowRight') { show(hot < 0 ? 0 : Math.min(periods.length - 1, hot + 1)); ev.preventDefault(); }
        else if (ev.key === 'ArrowLeft') { show(hot < 0 ? periods.length - 1 : Math.max(0, hot - 1)); ev.preventDefault(); }
      });
    }

    function drawGraph() {
      if (!graph || !graphDialog) return;
      var body = graphDialog.querySelector('#graph-body');
      var periods = graphPeriods(graph.c, graph.period).filter(function (p) { return p.date >= graph.from && p.date <= graph.to; });
      var values = graphValues(graph.c, graph.row, graph.period, periods);
      var width = Math.max(300, Math.floor(body.clientWidth || 640));
      var st = graphStats(periods, values, graph.period);
      body.innerHTML = chartSvg(periods, values, graph.kind, graph.row.unit, width, graph.trend, st);
      wireGraphHover(body, periods, values, graph.row.unit, graph.kind);
      graphDialog.querySelector('#graph-figures').innerHTML = figuresHtml(st, periods, graph.row.unit, graph.period);
      var units = unitName(graph.row.unit, graph.c.meta.currency);
      graphDialog.querySelector('#graph-units').textContent = units.charAt(0).toUpperCase() + units.slice(1) +
        (graph.period === 'quarterly' ? ', by quarter' + (graph.row.annual ? ', each built on the trailing four quarters' : '') : ', by fiscal year') +
        '. Oldest at the left, newest at the right.';
    }

    // ---- the price: the latest quote under the headline, with its chart ----
    // One call for the quote, one for a span of end-of-day bars, five for a day of
    // five-minute bars; each kept for the session, the quote for fifteen minutes.
    // The chart sits under the price, open unless the reader hid it: that choice
    // is kept under PRICE_GRAPH_KEY, and the price stays on show either way.
    var quotes = {};
    var priceSeries = {};
    var QUOTE_LIFE = 15 * 60 * 1000;
    var SPANS = [['1d', '1D'], ['1w', '1W'], ['1m', '1M'], ['6m', '6M'], ['1y', '1Y'], ['5y', '5Y'], ['10y', '10Y'], ['all', 'All time']];
    var priceGraph = null;
    var PRICE_GRAPH_KEY = 'wwws.priceGraph.v1';

    function priceGraphOpen() {
      try { return window.localStorage.getItem(PRICE_GRAPH_KEY) !== 'closed'; } catch (e) { return true; }
    }

    function setPriceGraphOpen(open) {
      try { window.localStorage.setItem(PRICE_GRAPH_KEY, open ? 'open' : 'closed'); } catch (e) {}
    }

    function relayFetch(path, params) {
      var direct = window.location.protocol === 'file:';
      var q = [];
      Object.keys(params || {}).forEach(function (k) { if (params[k] !== undefined && params[k] !== null && params[k] !== '') q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); });
      if (direct) q.push('api_token=' + encodeURIComponent(getToken()), 'fmt=json');
      var url = (direct ? 'https://eodhd.com/api/' : '/api/eodhd/') + path + (q.length ? '?' + q.join('&') : '');
      return window.fetch(url, { headers: direct ? {} : { 'X-Api-Token': getToken() } }).then(function (res) {
        return res.text().then(function (body) {
          var data = null;
          try { data = JSON.parse(body); } catch (e) {}
          if (!res.ok) throw new Error(httpMessage(res.status, data));
          return data;
        });
      }, function () {
        throw new Error('Could not reach the data service. Check your connection and try again.');
      });
    }

    function quoteWhen(q) {
      var t = num(q.timestamp);
      if (t === null) return '';
      var d = new Date(t * 1000);
      return 'as of ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' on ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ', delayed';
    }

    function signed(v, fmt) {
      return (v > 0 ? '+' : (v < 0 ? '−' : '')) + fmt(Math.abs(v));
    }

    function priceHtml(c) {
      var e = quotes[c.symbol], inner, graph = '';
      if (e && e.q) {
        var q = e.q, chg = num(q.change), pct = num(q.change_p), open = priceGraphOpen();
        inner = '<span class="now">' + esc(fmtPrice(num(q.close))) + (c.meta.currency ? ' ' + esc(c.meta.currency) : '') + '</span>' +
          (chg !== null && pct !== null ? '<span class="chg' + (chg < 0 ? ' neg' : '') + '">' + esc(signed(chg, fmtPrice) + ' (' + signed(pct, function (x) { return x.toFixed(2) + '%'; }) + ') today') + '</span>' : '') +
          '<span class="when">' + esc(quoteWhen(q)) + '</span>' +
          '<button type="button" class="linkbtn" id="price-toggle" aria-controls="price-graph" aria-expanded="' + (open ? 'true' : 'false') + '">' + (open ? 'Hide graph' : 'Show graph') + '</button>';
        graph = '<div class="price-graph" id="price-graph"' + (open ? '' : ' hidden') + '>' +
          '<div class="spans" id="price-spans" role="group" aria-label="Time span">' + SPANS.map(function (sp) {
            return '<button type="button" data-span="' + sp[0] + '" aria-pressed="false">' + sp[1] + '</button>';
          }).join('') + '</div>' +
          '<p class="rule" id="price-sub"></p>' +
          '<div class="graph-body" id="price-body"></div>' +
          '<div class="graph-figures" id="price-figures"></div>' +
          '<p class="units" id="price-units"></p></div>';
      } else if (e && e.error) {
        inner = '<span class="when">' + esc(e.error) + '</span><button type="button" class="linkbtn" id="price-get">Try again</button>';
      } else if ((e && e.loading) || getToken()) {
        inner = '<span class="when">Fetching the latest price…</span>';
      } else {
        inner = '<span class="when">Not available without an EODHD key.</span>';
      }
      return '<div class="price-block" id="price"><p class="price"><b>Price</b>' + inner + '</p>' + graph + '</div>';
    }

    function wirePrice(c, tokenInput, rememberBox) {
      var block = document.getElementById('price');
      if (!block) return;
      var get = document.getElementById('price-get');
      if (get) get.addEventListener('click', function () {
        var typed = tokenInput.value.trim();
        if (typed) setToken(typed, rememberBox.checked);
        if (!getToken()) { tokenInput.focus(); return; }
        delete quotes[c.symbol];
        refreshPrice(c, tokenInput, rememberBox);
      });
      var toggle = document.getElementById('price-toggle');
      if (toggle) toggle.addEventListener('click', function () {
        var g = document.getElementById('price-graph');
        if (!g) return;
        var open = !!g.hidden;
        g.hidden = !open;
        setPriceGraphOpen(open);
        toggle.textContent = open ? 'Hide graph' : 'Show graph';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) drawPrice();
      });
      var spans = document.getElementById('price-spans');
      if (spans) spans.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('button[data-span]') : null;
        if (!b || !priceGraph) return;
        priceGraph.span = b.getAttribute('data-span');
        drawPrice();
      });
      if (!tokenInput.priceWired) {
        tokenInput.priceWired = true;
        tokenInput.addEventListener('change', function () {
          var typed = tokenInput.value.trim();
          if (!typed) return;
          setToken(typed, rememberBox.checked);
          var cur = quotes[c.symbol];
          if (cur && (cur.q || cur.loading)) return;
          delete quotes[c.symbol];
          refreshPrice(c, tokenInput, rememberBox);
        });
      }
      var e = quotes[c.symbol];
      if (e && e.q) {
        priceGraph = { c: c, span: priceGraph && priceGraph.span ? priceGraph.span : '5y' };
        drawPrice();
      }
      if ((!e || (!e.loading && !e.q && !e.error) || (e.q && Date.now() - e.at > QUOTE_LIFE)) && getToken()) fetchQuote(c, tokenInput, rememberBox);
    }

    function refreshPrice(c, tokenInput, rememberBox) {
      var line = document.getElementById('price');
      if (!line || !currentCompany || currentCompany.symbol !== c.symbol) return;
      var holder = document.createElement('div');
      holder.innerHTML = priceHtml(c);
      line.parentNode.replaceChild(holder.firstElementChild, line);
      wirePrice(c, tokenInput, rememberBox);
    }

    function fetchQuote(c, tokenInput, rememberBox) {
      quotes[c.symbol] = { loading: true, at: Date.now() };
      refreshPrice(c, tokenInput, rememberBox);
      relayFetch('real-time/' + encodeURIComponent(c.symbol), {}).then(function (q) {
        if (!q || typeof q !== 'object' || num(q.close) === null) throw new Error('EODHD sent no price for ' + c.symbol + '.');
        quotes[c.symbol] = { q: q, at: Date.now() };
      }).catch(function (e) {
        quotes[c.symbol] = { error: e && e.message ? e.message : 'The price could not be fetched.', at: Date.now() };
      }).then(function () { refreshPrice(c, tokenInput, rememberBox); });
    }

    // ---- the price chart, drawn under the price ----
    window.addEventListener('resize', function () {
      var g = document.getElementById('price-graph');
      if (g && !g.hidden && priceGraph) drawPrice();
    });

    function spanRequest(symbol, span) {
      var now = new Date();
      function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function back(months, days) { var t = new Date(now); if (months) t.setMonth(t.getMonth() - months); if (days) t.setDate(t.getDate() - days); return t; }
      var sym = encodeURIComponent(symbol);
      if (span === '1d') return { path: 'intraday/' + sym, params: { interval: '5m', from: Math.floor(now.getTime() / 1000) - 5 * 86400, to: Math.floor(now.getTime() / 1000) } };
      if (span === '1w') return { path: 'eod/' + sym, params: { from: iso(back(0, 7)), to: iso(now), period: 'd', order: 'a' } };
      if (span === '1m') return { path: 'eod/' + sym, params: { from: iso(back(1, 0)), to: iso(now), period: 'd', order: 'a' } };
      if (span === '6m') return { path: 'eod/' + sym, params: { from: iso(back(6, 0)), to: iso(now), period: 'd', order: 'a' } };
      if (span === '1y') return { path: 'eod/' + sym, params: { from: iso(back(12, 0)), to: iso(now), period: 'd', order: 'a' } };
      if (span === '5y') return { path: 'eod/' + sym, params: { from: iso(back(60, 0)), to: iso(now), period: 'w', order: 'a' } };
      if (span === '10y') return { path: 'eod/' + sym, params: { from: iso(back(120, 0)), to: iso(now), period: 'w', order: 'a' } };
      return { path: 'eod/' + sym, params: { from: '1900-01-01', to: iso(now), period: 'm', order: 'a' } };
    }

    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function dayLabel(ymd) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd);
      return m ? parseInt(m[3], 10) + ' ' + MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1] : ymd;
    }

    function pricePoints(span, rows) {
      if (!Array.isArray(rows)) return [];
      var pts = [];
      if (span === '1d') {
        var byDay = {};
        rows.forEach(function (r) {
          var dt = String(r.datetime || ''), close = num(r.close);
          if (dt.length < 16 || close === null) return;
          (byDay[dt.slice(0, 10)] = byDay[dt.slice(0, 10)] || []).push({ dt: dt, v: close, ts: num(r.timestamp) });
        });
        var days = Object.keys(byDay).sort();
        if (!days.length) return [];
        var last = days[days.length - 1];
        byDay[last].sort(function (a, b) { return a.dt < b.dt ? -1 : 1; }).forEach(function (r) {
          var d = r.ts !== null ? new Date(r.ts * 1000) : null;
          var hm = d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : r.dt.slice(11, 16);
          pts.push({ date: r.dt, label: dayLabel(last) + ', ' + hm, short: hm, value: r.v });
        });
        return pts;
      }
      rows.forEach(function (r) {
        var date = String(r.date || ''), close = num(r.close);
        if (date.length < 10 || close === null) return;
        var m = /^(\d{4})-(\d{2})/.exec(date);
        var short = span === 'all' ? m[1] : (span === '5y' || span === '10y') ? MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1].slice(2) : parseInt(date.slice(8, 10), 10) + ' ' + MONTHS[parseInt(m[2], 10) - 1];
        pts.push({ date: date, label: span === 'all' ? MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1] : dayLabel(date), short: short, value: close });
      });
      pts.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      return pts;
    }

    function loadPriceSeries(c, span) {
      var key = c.symbol + '|' + span;
      if (priceSeries[key]) return Promise.resolve(priceSeries[key]);
      var req = spanRequest(c.symbol, span);
      return relayFetch(req.path, req.params).then(function (rows) {
        var pts = pricePoints(span, rows);
        priceSeries[key] = { points: pts, at: Date.now() };
        return priceSeries[key];
      });
    }

    function priceFiguresHtml(pts, currency) {
      if (!pts.length) return '';
      var first = pts[0].value, last = pts[pts.length - 1].value, lo = pts[0], hi = pts[0];
      pts.forEach(function (p) { if (p.value < lo.value) lo = p; if (p.value > hi.value) hi = p; });
      var chg = last - first, pct = first ? chg / Math.abs(first) : null;
      var rows = [
        ['Start', fmtPrice(first) + ' (' + pts[0].label + ')'],
        ['End', fmtPrice(last) + ' (' + pts[pts.length - 1].label + ')'],
        ['Change', signed(chg, fmtPrice) + (pct !== null ? ' (' + signed(pct * 100, function (x) { return x.toFixed(2) + '%'; }) + ')' : '')],
        ['High', fmtPrice(hi.value) + ' (' + hi.label + ')'],
        ['Low', fmtPrice(lo.value) + ' (' + lo.label + ')']
      ];
      return '<dl class="figures">' + rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>';
    }

    function drawPrice() {
      var g = document.getElementById('price-graph');
      if (!priceGraph || !g || g.hidden) return;
      var c = priceGraph.c, span = priceGraph.span;
      Array.prototype.forEach.call(g.querySelectorAll('#price-spans button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-span') === span ? 'true' : 'false'); });
      var body = g.querySelector('#price-body'), figures = g.querySelector('#price-figures'), units = g.querySelector('#price-units');
      var name = SPANS.filter(function (sp) { return sp[0] === span; })[0][1];
      g.querySelector('#price-sub').textContent = span === '1d' ? 'The last trading day, every five minutes' : span === 'all' ? 'All time, by month' : (span === '5y' || span === '10y') ? name + ', by week' : name + ', by day';
      if (!getToken()) {
        body.innerHTML = '<p class="hint">Paste your EODHD token above to draw the price.</p>';
        figures.innerHTML = ''; units.textContent = '';
        return;
      }
      body.innerHTML = '<p class="hint">Fetching…</p>';
      var want = span;
      loadPriceSeries(c, span).then(function (series) {
        if (!priceGraph || priceGraph.span !== want || priceGraph.c !== c || body !== document.getElementById('price-body')) return;
        var pts = series.points;
        var width = Math.max(300, Math.floor(body.clientWidth || 640));
        var values = pts.map(function (p) { return p.value; });
        body.innerHTML = pts.length ? chartSvg(pts, values, 'line', 'price', width, 'none', null) : '<p class="hint">EODHD sent no prices for this span.</p>';
        if (pts.length) wireGraphHover(body, pts, values, 'price', 'line');
        figures.innerHTML = priceFiguresHtml(pts, c.meta.currency);
        units.textContent = (c.meta.currency ? 'Prices in ' + c.meta.currency + '. ' : '') + 'Closing price of each bar, oldest at the left, newest at the right. ' +
          (span === '1d' ? 'Five calls for the day of five-minute bars.' : 'One call for the span.');
      }).catch(function (e) {
        if (!priceGraph || priceGraph.span !== want || body !== document.getElementById('price-body')) return;
        body.innerHTML = '<p class="hint">' + esc(e && e.message ? e.message : 'The prices could not be fetched.') + '</p>';
        figures.innerHTML = ''; units.textContent = '';
      });
    }

    var currentCompany = null;
    app.addEventListener('click', function (ev) {
      var btn = ev.target.closest ? ev.target.closest('button.yr') : null;
      if (btn && currentCompany) { ev.preventDefault(); toggleYear(currentCompany, btn.getAttribute('data-date')); return; }
      var g = ev.target.closest ? ev.target.closest('button.graph') : null;
      if (g && currentCompany) { ev.preventDefault(); openGraph(currentCompany, NUMBER_ROWS[parseInt(g.getAttribute('data-row'), 10)]); }
    });
    var viewChapters = document.getElementById('view-chapters');
    var viewNumbers = document.getElementById('view-numbers');
    var viewWatchlists = document.getElementById('view-watchlists');
    var viewScreen = document.getElementById('view-screen');
    var sectionPick = document.getElementById('section-pick');

    function showView(name) {
      var onChapters = name === 'chapters';
      viewChapters.classList.toggle('active', onChapters);
      viewNumbers.classList.toggle('active', name === 'numbers');
      viewScreen.classList.toggle('active', name === 'screen');
      viewWatchlists.classList.toggle('active', name === 'watchlists');
      sectionPick.hidden = !onChapters;
      if (name === 'numbers') hideTabs();
    }

    function route() {
      if (pendingFlush) { pendingFlush(); pendingFlush = null; }
      var id = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
      var numbersMatch = /^(?:numbers|companies)(?:\/(.*))?$/i.exec(id);
      if (id === '' || numbersMatch) {
        var wanted = numbersMatch ? numbersMatch[1] || '' : '';
        renderNumbers(wanted);
        document.title = (currentCompany && wanted ? currentCompany.meta.name + ' - Companies - ' : (wanted ? 'Companies - ' : '')) + 'What Would Warren Say?';
        window.scrollTo(0, 0);
        bindFrames();
        return;
      }
      var screenMatch = /^screen(?:\/(.*))?$/i.exec(id);
      if (screenMatch) {
        renderScreen(screenMatch[1] || '');
        document.title = (screenState.venue ? (VENUE_NAMES[screenState.venue] || screenState.venue) + ' - ' : '') + 'Screen - What Would Warren Say?';
        window.scrollTo(0, 0);
        bindFrames();
        return;
      }
      var listMatch = /^watchlists(?:\/(.*))?$/i.exec(id);
      if (listMatch) {
        renderWatchlists(listMatch[1] || '');
        document.title = (renderedList ? renderedList.name + ' - ' : '') + 'Watchlists - What Would Warren Say?';
        window.scrollTo(0, 0);
        bindFrames();
        return;
      }
      showView('chapters');
      var ch = byId[id];
      if (ch) {
        lastInPart[ch.part] = ch.id;
        sectionEl.value = String(ch.part);
        renderTabs(ch.part, ch.id);
        renderChapter(ch);
        document.title = label(ch) + ' - What Would Warren Say?';
      } else {
        sectionEl.value = '';
        hideTabs();
        renderContents();
        document.title = 'Chapters - What Would Warren Say?';
      }
      window.scrollTo(0, 0);
      bindFrames();
    }

    // ---- export / import ---------------------------------------------------
    function exportEntries() {
      if (pendingFlush) pendingFlush();
      var payload = {
        app: 'what-would-warren-say',
        version: 1,
        exportedAt: new Date().toISOString(),
        book: 'Warren Buffett and the Interpretation of Financial Statements',
        entries: entries,
        watchlists: watchlists.lists
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'what-would-warren-say-' + dateStamp() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      var n = Object.keys(entries).length, w = watchlists.lists.length;
      setStatus('Exported ' + n + ' page' + (n === 1 ? '' : 's') + (w ? ' and ' + w + ' watchlist' + (w === 1 ? '' : 's') : '') + ' to ' + a.download);
    }

    function importText(text) {
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        setStatus('Could not import: that is not a JSON export from this site.');
        return;
      }
      var incoming = cleanEntries(parsed && parsed.entries ? parsed.entries : parsed);
      var lists = cleanLists(parsed && parsed.watchlists);
      var ids = Object.keys(incoming);
      if (!ids.length && !lists.length) {
        setStatus('Nothing to import: no chapter entries or watchlists found in that file.');
        return;
      }
      var imported = 0, kept = 0;
      ids.forEach(function (id) {
        var mine = entries[id], theirs = incoming[id];
        if (mine && mine.updated && theirs.updated && mine.updated > theirs.updated) { kept++; return; }
        entries[id] = theirs;
        imported++;
      });
      if (ids.length) saveEntries();
      // a list from the file replaces the one here unless the one here was changed more
      // recently; a list that is already here, word for word, is left as it is
      var listsIn = 0, listsKept = 0;
      lists.forEach(function (theirs) {
        var mine = listById(theirs.id);
        if (mine && mine.updated && (!theirs.updated || mine.updated > theirs.updated)) { listsKept++; return; }
        if (mine && mine.name === theirs.name && JSON.stringify(mine.items) === JSON.stringify(theirs.items)) return;
        if (mine) { mine.name = theirs.name; mine.items = theirs.items; mine.updated = theirs.updated; }
        else watchlists.lists.push(theirs);
        listsIn++;
      });
      if (listsIn) saveWatchlists();
      function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
      var got = [], held = [];
      if (ids.length) { got.push(plural(imported, 'page')); if (kept) held.push(listsIn || listsKept ? plural(kept, 'page') : String(kept)); }
      if (listsIn || listsKept) { got.push(plural(listsIn, 'watchlist')); if (listsKept) held.push(plural(listsKept, 'watchlist')); }
      if (!got.length) {
        setStatus('Nothing new to import: the watchlists in that file are already here.');
        return;
      }
      setStatus('Imported ' + got.join(' and ') +
        (held.length ? ', kept ' + held.join(' and ') + ' that ' + (kept + listsKept === 1 ? 'was' : 'were') + ' newer here' : '') + '.');
      route();
    }

    var fileInput = document.getElementById('import-file');
    document.getElementById('export').addEventListener('click', exportEntries);
    document.getElementById('import').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { importText(reader.result); };
      reader.onerror = function () { setStatus('Could not read that file.'); };
      reader.readAsText(file);
    });

    // ---- boot --------------------------------------------------------------
    document.getElementById('today').textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    window.addEventListener('hashchange', route);
    window.addEventListener('beforeunload', function () { if (pendingFlush) pendingFlush(); });
    route();
    loadSamples();
    loadStoreIndex();
    loadBundleIndex();
  })();
  </script>
</body>
