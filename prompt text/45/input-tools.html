<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Input Tools — BasilicaLabs.AI</title><style>:root{--paper:#FFFFFF;--ink:#111111;--ink-60:#5A5A5A;--ink-35:#A9A9A9;--hair:#E3E3E3;--font-brand:"Avenir Next","Helvetica Neue",Arial,sans-serif;--font-serif:Georgia,"Times New Roman",serif;--font-display:Georgia,serif;--gap:24px;--wrap:100%;}body{margin:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;}.pg-credit{font-family:var(--font-brand);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);margin-top:1.1rem;}.pg-credit a{color:inherit;}
  .hero{ border:1px solid var(--hair); padding:.9rem 1.2rem; margin-bottom:var(--gap);
    display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
  .hero .ital{ font-family:var(--font-serif); font-style:italic; font-size:1.5rem; }
  .hero .display{ font-family:var(--font-display); font-size:1.9rem; letter-spacing:.04em; }
  .hero .sub{ font-family:var(--font-brand); font-size:.62rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--ink-60); }

  .soon-panel{ border:1px solid var(--hair); padding:clamp(3rem,12vh,7rem) 1.5rem;
    display:flex; flex-direction:column; align-items:center; gap:1.2rem; text-align:center; }
  .soon-word{ font-family:var(--font-brand); font-weight:600;
    font-size:clamp(2rem,6vw,3.6rem); letter-spacing:.3em; text-transform:uppercase; color:var(--ink); }
  .soon-panel p{ font-family:var(--font-serif); font-style:italic; color:var(--ink-60);
    font-size:1.02rem; max-width:36rem; margin:0; line-height:1.6; }
  .soon-form{ display:flex; gap:.5rem; width:min(26rem,100%); }
  .soon-form input{ flex:1; min-width:0; font-family:var(--font-serif); font-size:.95rem;
    padding:.65rem .7rem; border:1px solid var(--hair); background:var(--paper); color:var(--ink); border-radius:0; }
  .soon-form input:focus{ outline:none; border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .soon-form button{ font-family:var(--font-brand); font-weight:600; font-size:.68rem;
    letter-spacing:.16em; text-transform:uppercase; background:var(--ink); color:var(--paper);
    border:1px solid var(--ink); padding:.65rem 1.1rem; cursor:pointer; }
  .soon-form button:hover{ background:var(--paper); color:var(--ink); }
  .soon-note{ font-family:var(--font-brand); font-size:.66rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-60); min-height:1em; }

  /* ── intro strip + popup ── */
  .intro-strip{ border:1px solid var(--hair); padding:.9rem 1.2rem; margin-bottom:var(--gap); }
  .intro-strip p{ font-family:var(--font-serif); font-size:.95rem; color:var(--ink-60);
    margin:0; line-height:1.6; max-width:none; }
  .intro-strip b{ color:var(--ink); font-family:var(--font-brand); font-weight:600;
    letter-spacing:.06em; font-size:.85em; }
  .intro-pop{ position:fixed; inset:0; z-index:90; display:flex; align-items:center;
    justify-content:center; padding:1.2rem; background:rgba(17,17,17,.48); }
  .intro-pop[hidden]{ display:none; }
  .ip-card{ background:var(--paper); border:1px solid var(--ink); max-width:34rem;
    padding:2.2rem 2.4rem; display:flex; flex-direction:column; gap:1rem; align-items:flex-start; }
  .ip-kicker{ font-family:var(--font-brand); font-weight:600; font-size:.6rem;
    letter-spacing:.28em; text-transform:uppercase; color:var(--ink-60); }
  .ip-title{ font-family:var(--font-display); font-size:1.9rem; line-height:1.15; }
  .ip-title em{ font-family:var(--font-serif); }
  .ip-card p{ font-family:var(--font-serif); font-size:.98rem; line-height:1.65;
    color:var(--ink-60); margin:0; max-width:none; }
  .ip-card button{ font-family:var(--font-brand); font-weight:600; font-size:.68rem;
    letter-spacing:.2em; text-transform:uppercase; background:var(--ink); color:var(--paper);
    border:1px solid var(--ink); padding:.7rem 1.6rem; cursor:pointer; }
  .ip-card button:hover{ background:var(--paper); color:var(--ink); }
  .draw-sec > [hidden]{ display:none !important; }

  /* ── playground cards row ── */
  .play-row{ columns:560px; column-gap:var(--gap); margin-bottom:var(--gap); }
  .play-row > .draw-sec{ width:100%; margin:0 0 var(--gap); break-inside:avoid;
    page-break-inside:avoid; display:block; }

  /* ── 3d techniques card ── */
  .t3tab{ font-family:var(--font-brand); font-weight:500; font-size:.64rem; letter-spacing:.2em;
    text-transform:uppercase; background:none; border:none; color:var(--ink-60);
    padding:.2rem 0; cursor:pointer; border-bottom:2px solid transparent; }
  .t3tab.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .t3-boards{ display:flex; gap:.8rem; padding:.85rem .9rem .2rem; }
  .t3-b{ flex:1; min-width:0; }
  .t3-blab{ display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; font-family:var(--font-brand);
    font-size:.54rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-60);
    padding-bottom:.35rem; }
  .t3-chips{ display:flex; }
  .t3-chips[hidden]{ display:none; }
  .t3-chips button{ font-family:var(--font-brand); font-size:.54rem; letter-spacing:.1em;
    text-transform:uppercase; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.16rem .42rem; cursor:pointer; margin-left:-1px; }
  .t3-chips button:first-child{ margin-left:0; }
  .t3-chips button.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .t3-chips button.bcol.active{ background:#B01018; border-color:#B01018; color:#fff; }
  [data-theme="dark"] .t3-chips button.bcol.active{ background:#DE8286; border-color:#DE8286; color:#111; }
  .t3-btns{ margin-left:auto; display:flex; gap:.3rem; }
  .t3-clear{ font-family:var(--font-brand); font-size:.52rem; letter-spacing:.12em;
    text-transform:uppercase; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.16rem .42rem; cursor:pointer; }
  .t3-clear:hover{ background:var(--ink); color:var(--paper); }
  #t3Prof, #t3Path{ display:block; width:100%; height:auto; border:1px solid var(--hair);
    cursor:crosshair; touch-action:none; }
  .t3-blab2{ min-height:1.55rem; padding-top:.4rem; padding-bottom:.15rem; }
  .t3-note{ font-family:var(--font-serif); font-style:italic; font-size:.82rem; color:var(--ink-60);
    text-align:center; padding:0 1rem .9rem; }
  .t3-bhint{ font-family:var(--font-brand); font-size:.5rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-60); padding-top:.3rem; min-height:1.6em; }
  .t3-viewwrap{ position:relative; margin:.3rem .9rem .35rem; }
  #t3View{ display:block; width:100%; height:auto; border:1px solid var(--hair);
    cursor:grab; touch-action:none; }
  .t3-vnote{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 1.5rem; font-family:var(--font-serif); font-style:italic;
    font-size:.95rem; color:var(--ink-35); pointer-events:none; }
  .t3-axeschk{ position:absolute; top:.45rem; right:.45rem; display:flex; align-items:center;
    gap:.7rem; font-family:var(--font-brand); font-size:.54rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-60); }
  .t3-axeschk label{ display:flex; align-items:center; gap:.35rem; cursor:pointer; }
  .t3-axeschk input{ accent-color:var(--ink); margin:0; }

  /* ── input tools card ── */
  .it-body{ display:flex; flex-direction:column; gap:.85rem; padding:1rem 1.1rem 1.1rem; }
  .it-row{ display:flex; align-items:center; gap:.8rem; }
  .it-row > label{ font-family:var(--font-brand); font-size:.56rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-60); flex:0 0 7.5rem; }
  .it-row input[type="range"]{ flex:1; min-width:0; accent-color:var(--ink); }
  .it-row input[type="number"]{ width:4.4rem; font-family:var(--font-brand); font-size:.72rem;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink); padding:.28rem .35rem; }
  .it-step{ display:flex; align-items:stretch; gap:.25rem; }
  .it-step button{ width:1.9rem; border:1px solid var(--hair); background:var(--paper);
    color:var(--ink); cursor:pointer; font-size:.9rem; line-height:1; }
  .it-step button:hover{ background:var(--ink); color:var(--paper); }
  #itDial{ width:64px; height:64px; border:1px solid var(--hair); cursor:grab; touch-action:none; }
  #itPad{ width:88px; height:88px; border:1px solid var(--hair); cursor:crosshair; touch-action:none; }
  .it-toggle{ width:2.6rem; height:1.3rem; border:1px solid var(--ink); background:var(--paper);
    position:relative; cursor:pointer; padding:0; }
  .it-toggle span{ position:absolute; top:1px; left:1px; width:1.15rem; bottom:1px;
    background:var(--ink); transition:left .15s; }
  .it-toggle[aria-pressed="true"] span{ left:calc(100% - 1.25rem); }
  .it-seg{ display:flex; }
  .it-seg button{ font-family:var(--font-brand); font-size:.6rem; letter-spacing:.14em;
    text-transform:uppercase; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.3rem .7rem; cursor:pointer; margin-left:-1px; }
  .it-seg button:first-child{ margin-left:0; }
  .it-seg button.active{ background:var(--ink); color:var(--paper); }
  .it-out, .it-unit{ font-family:var(--font-brand); font-size:.6rem; letter-spacing:.16em;
    text-transform:uppercase; }
  .it-xy{ display:flex; gap:.3rem; }
  .it-pool{ display:flex; gap:.55rem; align-items:flex-end; }
  .it-pool input{ writing-mode:vertical-lr; direction:rtl; appearance:slider-vertical;
    -webkit-appearance:slider-vertical; width:1.1rem; height:64px; padding:0; accent-color:var(--ink); }
  #itMap{ width:96px; height:96px; border:1px solid var(--hair); cursor:crosshair; touch-action:none; }
  #itDom{ width:150px; height:26px; border:1px solid var(--hair); cursor:ew-resize; touch-action:none; }
  .it-mapwrap{ display:flex; flex-direction:column; gap:.35rem; align-items:flex-start; }
  .it-mini{ width:3.2rem !important; }
  .it-row > label.it-mini-lab{ flex:0 0 auto; margin-left:auto; }
  .it-mini-lab{ font-family:var(--font-brand); font-size:.52rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-60); }
  #itList, #itMapType, #itDialUnit{ font-family:var(--font-brand); font-size:.72rem; letter-spacing:.06em;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink); padding:.35rem .5rem; }
  .it-bang{ font-family:var(--font-brand); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    border:1px solid var(--ink); background:var(--paper); color:var(--ink); padding:.4rem .9rem; cursor:pointer; }
  .it-bang:active{ background:var(--ink); color:var(--paper); }
  #itPanel{ flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.35rem .5rem; }

  /* ── data input card ── */
  .di-body{ display:flex; flex-direction:column; gap:.8rem; padding:1rem 1.1rem 1.1rem; }
  .di-browse{ align-self:flex-start; font-family:var(--font-brand); font-size:.62rem;
    letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); padding:.55rem 1rem; cursor:pointer; }
  .di-browse:hover{ background:var(--paper); color:var(--ink); }
  .di-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.3rem; }
  .di-list li{ font-family:var(--font-brand); font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; border:1px dashed var(--ink-35); padding:.4rem .6rem;
    display:flex; justify-content:space-between; gap:.8rem; }
  .di-list .sz{ color:var(--ink-60); }

  /* ── column sections card ── */
  .cs-row{ display:flex; align-items:center; gap:.6rem; padding:.65rem 1.1rem 0; flex-wrap:wrap; }
  .cs-row label{ font-family:var(--font-brand); font-size:.56rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-60); }
  .cs-row select{ font-family:var(--font-brand); font-size:.72rem; letter-spacing:.06em;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink); padding:.35rem .5rem; }
  .cs-row select.cs-grow{ flex:1; min-width:0; }
  .cs-row input[type="number"]{ width:4.6rem; font-family:var(--font-brand); font-size:.72rem;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink); padding:.28rem .35rem; }
  .cs-boardwrap{ margin:.7rem .9rem .3rem; }
  #csBoard, #csView{ display:block; width:100%; height:auto; border:1px solid var(--hair); }
  #csView{ cursor:grab; touch-action:none; }
  #csH{ width:5.4rem; }
  #csHRange{ flex:1 1 auto; min-width:90px; max-width:190px; }
  .cs-viewwrap{ position:relative; }
  .cs-zoom{ position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; }
  .cs-zoom button{ width:26px; height:26px; padding:0; font-size:1rem; line-height:1;
    background:var(--paper); color:var(--ink); border:1px solid var(--hair); cursor:pointer; }
  .cs-zoom button:hover{ background:var(--ink); color:var(--paper); }
  /* ── import geometry card ── */
  .gi-body{ display:flex; flex-direction:column; gap:.55rem; }
  .gi-drop{ border:1px dashed var(--ink-35); padding:.55rem .7rem; display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
  .gi-drop.over{ border-color:var(--ink); background:rgba(17,17,17,.05); }
  .gi-hint{ font-family:var(--font-serif); font-style:italic; font-size:.76rem; color:var(--ink-60); }
  .gi-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .gi-list li{ display:flex; align-items:center; gap:.5rem; font-family:var(--font-brand); font-size:.72rem;
    border-bottom:1px dashed var(--ink-35); padding:.28rem 0; min-width:0; }
  .gi-list li.bad{ color:var(--ink-60); }
  .gi-list .fmt{ border:1px solid var(--ink); padding:.05rem .35rem; font-size:.58rem; letter-spacing:.12em;
    text-transform:uppercase; flex:0 0 auto; }
  .gi-list .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34%; }
  .gi-list .info{ color:var(--ink-60); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gi-list .x{ background:none; border:0; color:var(--ink-60); cursor:pointer; font-size:.95rem; line-height:1; padding:0 .2rem; }
  .gi-list .x:hover{ color:#B01018; }
  .gi-viewwrap{ position:relative; }
  #giView{ display:block; width:100%; height:auto; border:1px solid var(--hair); cursor:grab; touch-action:none; }
  .gi-zoom{ position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; }
  .gi-zoom button{ width:26px; height:26px; padding:0; font-size:.95rem; line-height:1;
    background:var(--paper); color:var(--ink); border:1px solid var(--hair); cursor:pointer; }
  .gi-zoom button:hover{ background:var(--ink); color:var(--paper); }
  .gi-stats{ font-family:var(--font-brand); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-60); }
  /* ── viewport widget rows (input tools) ── */
  .it-row.it-wide{ flex-direction:column; align-items:stretch; gap:.45rem; }
  .it-row.it-wide > label{ flex:0 0 auto; }
  .vw-range{ display:flex; align-items:center; gap:.6rem; flex:1; min-width:230px; flex-wrap:nowrap; }
  .vw-range canvas{ flex:1; min-width:60px; }
  .vw-stack{ display:flex; flex-direction:column; gap:.45rem; width:100%; }
  #vwView, #vwProt{ display:block; width:100%; border:1px solid var(--hair); touch-action:none; }
  #vwView{ cursor:grab; }
  #vwView:active{ cursor:grabbing; }
  #vwProt{ cursor:pointer; }
  .vw-read{ font-family:var(--font-brand); font-size:.68rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-60); font-variant-numeric:tabular-nums; }
  .vw-ctl{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .vw-lock, .vw-mini{ font-family:var(--font-brand); font-size:.56rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-60); display:flex; align-items:center; gap:.35rem; }
  .vw-lock input{ width:13px; height:13px; accent-color:var(--ink); }
  #vwDom{ flex:1; min-width:90px; height:26px; border:1px solid var(--hair);
    cursor:ew-resize; touch-action:none; display:block; }
  .cs-info{ font-family:var(--font-brand); font-size:.6rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-60); text-align:center; padding:.15rem .9rem .1rem; }
  .cs-exports{ padding:.5rem 1.1rem .35rem; justify-content:center; }

  /* ── graphs card ── */
  .grtab{ font-family:var(--font-brand); font-weight:500; font-size:.64rem; letter-spacing:.2em;
    text-transform:uppercase; background:none; border:none; color:var(--ink-60);
    padding:.2rem 0; cursor:pointer; border-bottom:2px solid transparent; }
  .grtab.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .gr-row{ display:flex; align-items:center; gap:.6rem; padding:.65rem 1.1rem 0; flex-wrap:wrap; }
  .gr-row label{ font-family:var(--font-brand); font-size:.56rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-60); }
  #grFx{ flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.78rem; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.45rem .6rem; }
  #grFx:focus{ outline:none; border-color:var(--ink); }
  .gr-row input[type="number"]{ width:5rem; font-family:var(--font-brand); font-size:.72rem;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink); padding:.28rem .35rem; }
  .gr-turnwrap{ display:flex; align-items:center; gap:.6rem; }
  .gr-turnwrap[hidden]{ display:none; }
  .gr-ex{ display:flex; flex-wrap:wrap; gap:.35rem; padding:.55rem 1.1rem 0; }
  .gr-ex button{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.66rem;
    border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    padding:.22rem .5rem; cursor:pointer; }
  .gr-ex button:hover{ background:var(--ink); color:var(--paper); }
  .gr-boardwrap{ margin:.7rem .9rem .35rem; }
  #grBoard{ display:block; width:100%; height:auto; border:1px solid var(--hair); }

  .asset-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:.7rem; width:min(56rem,100%); margin:.4rem 0; }
  .asset{ border:1px dashed var(--ink-35); padding:1rem .8rem; display:flex;
    flex-direction:column; gap:.35rem; align-items:center; opacity:.75; }
  .a-name{ font-family:var(--font-display); font-size:1.05rem; }
  .a-sub{ font-family:var(--font-brand); font-size:.56rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-60); }
  .ai-note{ border:1px solid var(--hair); padding:1rem 1.2rem; width:min(44rem,100%);
    text-align:left; }
  .ai-note-h{ font-family:var(--font-brand); font-weight:600; font-size:.62rem;
    letter-spacing:.24em; text-transform:uppercase; display:block; margin-bottom:.4rem; }
  .ai-note p{ font-family:var(--font-serif); font-size:.95rem; color:var(--ink-60);
    margin:0; line-height:1.6; max-width:none; font-style:normal; }
  .ai-note b{ color:var(--ink); font-family:var(--font-brand); font-weight:600;
    letter-spacing:.06em; }


  /* ── the 2D lines board (this whole block ships with the HTML export) ── */
  .draw-sec{ border:1px solid var(--hair); width:min(560px,100%); }
  .draw-cap{ display:flex; justify-content:space-between; align-items:baseline; gap:.8rem;
    padding:.6rem .9rem .5rem; border-bottom:1px solid var(--hair); flex-wrap:wrap; }
  .draw-cap b{ font-family:var(--font-brand); font-weight:500; font-size:.68rem;
    letter-spacing:.28em; text-transform:uppercase; }
  .draw-cap span{ font-family:var(--font-serif); font-style:italic; font-size:.82rem; color:var(--ink-60); }
  .pg-modes{ display:flex; justify-content:center; gap:1.3rem; padding:.55rem .9rem;
    border-bottom:1px solid var(--hair); flex-wrap:wrap; }
  .pgmode{ font-family:var(--font-brand); font-weight:600; font-size:.62rem; letter-spacing:.22em;
    text-transform:uppercase; background:none; border:none; color:var(--ink-60);
    padding:.2rem 0; cursor:pointer; border-bottom:2px solid transparent; }
  .pgmode.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .pg-tabs{ display:flex; justify-content:center; gap:1.05rem; padding:.55rem .9rem;
    border-bottom:1px solid var(--hair); flex-wrap:wrap; }
  .pgtab{ font-family:var(--font-brand); font-weight:500; font-size:.64rem; letter-spacing:.2em;
    text-transform:uppercase; background:none; border:none; color:var(--ink-60);
    padding:.2rem 0; cursor:pointer; border-bottom:2px solid transparent; }
  .pgtab.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .pg-pills{ display:flex; justify-content:center; gap:.45rem; padding:.6rem .9rem; flex-wrap:wrap;

    return null;
  }
  function radiusFromMouse(zc, mx, my){
    var C = S3(0, 0, zc), U = S3(1, 0, zc), V = S3(0, 1, zc);
    var ux = U.x - C.x, uy = U.y - C.y, vx = V.x - C.x, vy = V.y - C.y;
    var det = ux * vy - uy * vx;
    if(Math.abs(det) < 1e-9) return null;
    var rx = mx - C.x, ry = my - C.y;
    var c = (rx * vy - ry * vx) / det;
    var s = (ry * ux - rx * uy) / det;
    return Math.hypot(c, s);
  }
  function clampR(r){ return Math.max(RLO, Math.min(RHI, r)); }
  function angleFromMouse(R, zc, mx, my){
    var C = S3(0, 0, zc), U = S3(R, 0, zc), V = S3(0, R, zc);
    var ux = U.x - C.x, uy = U.y - C.y, vx = V.x - C.x, vy = V.y - C.y;
    var det = ux * vy - uy * vx;
    if(Math.abs(det) < 1e-6) return null;
    var rx = mx - C.x, ry = my - C.y;
    var c = (rx * vy - ry * vx) / det;
    var s = (ry * ux - rx * uy) / det;
    return Math.atan2(s, c) * 180 / Math.PI;
  }
  function norm(a){ return ((a % 360) + 360) % 360; }
  function vXY(e){
    var r = view.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  var mode = null, lx = 0, ly = 0, H0 = 0, y0 = 0, kPix = 1;
  function onMove(e){
    if(!mode) return;
    e.preventDefault();
    var m = vXY(e);
    if(mode === 'orbit'){
      cam.az += (e.clientX - lx) * 0.008;
      cam.pitch = Math.max(0.05, Math.min(Math.PI / 2 - 0.02, cam.pitch + (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY;
    } else if(mode === 'h'){
      W.H = Math.max(HMIN, Math.min(HMAX, H0 + (y0 - e.clientY) / kPix));
    } else if(mode === 'top'){
      var a = angleFromMouse(W.RT, W.H, m.x, m.y);
      if(a != null) W.top = norm(a - W.base);
    } else if(mode === 'base'){
      var a2 = angleFromMouse(W.RB, 0, m.x, m.y);
      if(a2 != null) W.base = norm(a2);
    } else if(mode === 'rt'){
      var rr = radiusFromMouse(W.H, m.x, m.y);
      if(rr != null) W.RT = clampR(rr);
    } else if(mode === 'rb'){
      var rr2 = radiusFromMouse(0, m.x, m.y);
      if(rr2 != null) W.RB = clampR(rr2);
    }
    drawView();
  }
  function endDrag(){
    mode = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', endDrag);
    document.removeEventListener('pointercancel', endDrag);
  }
  if(view) view.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var m = vXY(e);
    mode = hitHandle(m.x, m.y) || 'orbit';
    lx = e.clientX; ly = e.clientY;
    if(mode === 'h'){
      H0 = W.H; y0 = e.clientY;
      kPix = (SR(RULX, 0).y - SR(RULX, 100).y) / 100;
      if(!(kPix > 1e-4)) kPix = 1e-4;
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
  });
  if(view) view.addEventListener('pointermove', function(e){
    if(mode) return;
    var m = vXY(e);
    view.style.cursor = hitHandle(m.x, m.y) ? 'pointer' : 'grab';
  });
  if(view) view.addEventListener('wheel', function(e){
    e.preventDefault();
    cam.zoom = Math.max(0.5, Math.min(4, cam.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    drawView();
  }, { passive: false });
  if(view) view.addEventListener('dblclick', function(){
    cam.az = 0.62; cam.pitch = 0.5; cam.zoom = 1; drawView();
  });

  /* ── the radius range: typed min/max + a domain track, one clamp ── */
  var dom = document.getElementById('vwDom');
  var domCtx = dom ? dom.getContext('2d') : null;
  var radLo = document.getElementById('vwRadLo'), radHi = document.getElementById('vwRadHi');
  var dw = 0, dh = 0;
  function domX(r){ return 8 + (r - RBND.lo) / (RBND.hi - RBND.lo) * (dw - 16); }
  function domR(x){ return RBND.lo + (x - 8) / Math.max(1, dw - 16) * (RBND.hi - RBND.lo); }
  function drawDom(){
    if(!domCtx || dw < 20) return;
    domCtx.clearRect(0, 0, dw, dh);
    var mid = dh / 2, red = RED();
    domCtx.strokeStyle = INK(.25); domCtx.lineWidth = 1;
    domCtx.beginPath(); domCtx.moveTo(8, mid); domCtx.lineTo(dw - 8, mid); domCtx.stroke();
    var xa = domX(RLO), xb = domX(RHI);
    domCtx.strokeStyle = red; domCtx.lineWidth = 3;
    domCtx.beginPath(); domCtx.moveTo(xa, mid); domCtx.lineTo(xb, mid); domCtx.stroke();
    domCtx.lineWidth = 1.4; domCtx.fillStyle = PAPER();
    [xa, xb].forEach(function(x){
      domCtx.beginPath(); domCtx.rect(x - 4, mid - 6, 8, 12);
      domCtx.fill(); domCtx.stroke();
    });
  }
  function applyRange(){
    if(RLO > RHI){ var t2 = RLO; RLO = RHI; RHI = t2; }
    RLO = Math.max(RBND.lo, Math.min(RBND.hi, RLO));
    RHI = Math.max(RBND.lo, Math.min(RBND.hi, RHI));
    if(RHI - RLO < 20) RHI = Math.min(RBND.hi, RLO + 20);
    if(radLo) radLo.value = Math.round(RLO);
    if(radHi) radHi.value = Math.round(RHI);
    W.RB = clampR(W.RB); W.RT = clampR(W.RT);
    drawDom(); drawView();
  }
  if(radLo) radLo.addEventListener('change', function(){
    var v2 = parseFloat(this.value);
    if(isFinite(v2)) RLO = v2;
    applyRange();
  });
  if(radHi) radHi.addEventListener('change', function(){
    var v2 = parseFloat(this.value);
    if(isFinite(v2)) RHI = v2;
    applyRange();
  });
  var dDrag = null;
  function dSet(e){
    var r = dom.getBoundingClientRect();
    var v2 = domR(e.clientX - r.left);
    if(dDrag === 'lo') RLO = Math.min(v2, RHI - 20);
    else RHI = Math.max(v2, RLO + 20);
    applyRange();
  }
  function dMove(e){ if(dDrag){ e.preventDefault(); dSet(e); } }
  function dUp(){
    dDrag = null;
    document.removeEventListener('pointermove', dMove);
    document.removeEventListener('pointerup', dUp);
    document.removeEventListener('pointercancel', dUp);
  }
  if(dom) dom.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var r = dom.getBoundingClientRect(), x = e.clientX - r.left;
    dDrag = (Math.abs(x - domX(RLO)) <= Math.abs(x - domX(RHI))) ? 'lo' : 'hi';
    dSet(e);
    document.addEventListener('pointermove', dMove);
    document.addEventListener('pointerup', dUp);
    document.addEventListener('pointercancel', dUp);
  });
  [lockRotEl, lockRadEl].forEach(function(cb){
    if(cb) cb.addEventListener('click', function(){
      cb.setAttribute('aria-pressed', cb.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      drawView();
    });
  });

  /* ── the angular widget: a 0-180 protractor, dragged not typed ── */
  var PA = 45;
  function pPt(cx, cy, R, aDeg){
    var a = aDeg * Math.PI / 180;
    return { x: cx + R * Math.cos(a), y: cy - R * Math.sin(a) };
  }
  function drawProt(){
    if(!prot || pw < 10) return;
    pctx.clearRect(0, 0, pw, ph);
    /* the angle widget draws in ink — black on paper, white in dark mode */
    var red = dark() ? '#F2F2F2' : '#111111';
    var cx = pw / 2, cy = ph - 30;
    var R = Math.min(pw * 0.40, ph - 74);
    pctx.strokeStyle = red; pctx.fillStyle = red;
    pctx.lineWidth = 1.2; pctx.lineJoin = 'round';
    pctx.beginPath();
    for(var i = 0; i <= 90; i++){
      var p = pPt(cx, cy, R, i * 2);
      if(i) pctx.lineTo(p.x, p.y); else pctx.moveTo(p.x, p.y);
    }
    pctx.stroke();
    pctx.lineWidth = 1;
    for(var d = 0; d <= 180; d += 3){
      var len = (d % 15 === 0) ? 16 : 9;
      var q0 = pPt(cx, cy, R, d), q1 = pPt(cx, cy, R - len, d);
      pctx.beginPath(); pctx.moveTo(q0.x, q0.y); pctx.lineTo(q1.x, q1.y); pctx.stroke();
    }
    pctx.font = '12px "Afacad Flux",sans-serif';
    pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
    for(var dl = 0; dl <= 180; dl += 15){
      var pl = pPt(cx, cy, R + 24, dl);
      pctx.fillText(dl + '°', pl.x, pl.y);
    }
    /* dashed baseline + handle radius */
    pctx.setLineDash([5, 5]); pctx.globalAlpha = .7;
    var b1 = pPt(cx, cy, R - 4, 0), h1 = pPt(cx, cy, R - 4, PA);
    pctx.beginPath(); pctx.moveTo(cx, cy); pctx.lineTo(b1.x, b1.y); pctx.stroke();
    pctx.beginPath(); pctx.moveTo(cx, cy); pctx.lineTo(h1.x, h1.y); pctx.stroke();
    pctx.setLineDash([]); pctx.globalAlpha = 1;
    /* the swept angle arc with an arrowhead */
    var AR = Math.max(26, R * 0.16);
    pctx.beginPath();
    var steps = Math.max(8, Math.round(PA / 3));
    for(var s = 0; s <= steps; s++){
      var pa = pPt(cx, cy, AR, PA * s / steps);
      if(s) pctx.lineTo(pa.x, pa.y); else pctx.moveTo(pa.x, pa.y);
    }
    pctx.stroke();
    if(PA > 6){
      var tip = pPt(cx, cy, AR, PA);
      var tang = (PA + 90) * Math.PI / 180;
      pctx.beginPath();
      pctx.moveTo(tip.x, tip.y);
      pctx.lineTo(tip.x + 7 * Math.cos(tang + 2.6), tip.y - 7 * Math.sin(tang + 2.6));
      pctx.lineTo(tip.x + 7 * Math.cos(tang - 2.6), tip.y - 7 * Math.sin(tang - 2.6));
      pctx.closePath(); pctx.fill();
    }
    /* the value rides the handle radius */
    /* the value reads in the chosen unit — degrees, radians or 1:x slope */
    var uSel = document.getElementById('vwProtUnit');
    var uBtn = uSel ? uSel.querySelector('button.active') : null;
    var unit = uBtn ? uBtn.getAttribute('data-u') : 'deg', txt;
    if(unit === 'rad') txt = (PA * Math.PI / 180).toFixed(3) + ' rad';
    else if(unit === 'slope'){
      if(PA <= 0.05) txt = '1:\u221E';
      else {
        var run = 1 / Math.tan(PA * Math.PI / 180);
        txt = '1:' + (Math.abs(run) < 0.005 ? '0' : run.toFixed(2));
      }
    }
    else txt = PA.toFixed(2) + '°';
    pctx.save();
    pctx.translate(cx, cy);
    var aR = PA * Math.PI / 180;
    if(PA <= 90){ pctx.rotate(-aR); pctx.textAlign = 'center'; pctx.fillText(txt, R * 0.42, -10); }
    else { pctx.rotate(Math.PI - aR); pctx.fillText(txt, -R * 0.42, -10); }
    pctx.restore();
    /* the handle */
    var hp = pPt(cx, cy, R, PA);
    pctx.beginPath(); pctx.arc(hp.x, hp.y, 6, 0, 2 * Math.PI);
    pctx.fillStyle = PAPER(); pctx.fill();
    pctx.lineWidth = 2; pctx.stroke();
    pctx.fillStyle = red;
  }
  var protUnitSel = document.getElementById('vwProtUnit');
  if(protUnitSel) protUnitSel.addEventListener('click', function(e){
    var b2 = e.target && e.target.closest ? e.target.closest('button') : null;
    if(!b2) return;
    var all = protUnitSel.querySelectorAll('button');
    for(var i = 0; i < all.length; i++) all[i].classList.remove('active');
    b2.classList.add('active');
    drawProt();
  });
  var pDrag = false;
  function protSet(e){
    var r = prot.getBoundingClientRect();
    var cx = pw / 2, cy = ph - 30;
    var a = Math.atan2((cy - (e.clientY - r.top)), (e.clientX - r.left) - cx) * 180 / Math.PI;
    PA = Math.max(0, Math.min(180, Math.round(a * 2) / 2));
    drawProt();
  }
  function pMove(e){ if(pDrag){ e.preventDefault(); protSet(e); } }
  function pUp(){
    pDrag = false;
    document.removeEventListener('pointermove', pMove);
    document.removeEventListener('pointerup', pUp);
    document.removeEventListener('pointercancel', pUp);
  }
  if(prot) prot.addEventListener('pointerdown', function(e){
    e.preventDefault();
    pDrag = true; protSet(e);
    document.addEventListener('pointermove', pMove);
    document.addEventListener('pointerup', pUp);
    document.addEventListener('pointercancel', pUp);
  });

  /* ── sizing + theme ── */
  function drawAll(){ drawView(); drawProt(); drawDom(); }
  function size(){
    var dpr = Math.max(window.devicePixelRatio || 1, 1);
    if(view){
      var wc = view.parentElement.clientWidth;
      if(wc >= 40){
        vw = wc; vh = Math.max(300, Math.round(wc * 0.74));
        view.style.width = vw + 'px'; view.style.height = vh + 'px';
        view.width = Math.round(vw * dpr); view.height = Math.round(vh * dpr);
        vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    if(prot){
      var wp = prot.parentElement.clientWidth;
      if(wp >= 40){
        pw = wp; ph = Math.max(220, Math.round(wp * 0.52));
        prot.style.width = pw + 'px'; prot.style.height = ph + 'px';
        prot.width = Math.round(pw * dpr); prot.height = Math.round(ph * dpr);
        pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    if(dom){
      var rd = dom.getBoundingClientRect();
      if(rd.width >= 20){
        dw = rd.width; dh = rd.height;
        dom.width = Math.round(dw * dpr); dom.height = Math.round(dh * dpr);
        domCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    drawAll();
  }
  window.addEventListener('resize', size);
  if(window.ResizeObserver){
    var ro = new ResizeObserver(function(){ size(); });
    if(view) ro.observe(view.parentElement);
    if(prot) ro.observe(prot.parentElement);
  }
  new MutationObserver(function(){ drawAll(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  window.__vw = { W: W, cam: cam, angle: function(){ return PA; },
                  setAngle: function(a){ PA = Math.max(0, Math.min(180, a)); drawProt(); },
                  range: function(){ return { lo: RLO, hi: RHI }; },
                  hnd: function(){ return HND; }, draw: drawAll };
  size();
})();
</script></body></html>
